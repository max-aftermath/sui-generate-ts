
# TS Generator ON Rust
[config]
rpc = "https://fullnode.mainnet.sui.io:443"

[package]
name = "generator"
version = "0.1.0"
edition = "2024"


[dependencies]
tokio = "1.44.2"
anyhow = "1.0.71"
futures = "0.3.28"
tempfile = "^3.20.0"
toml = { version = "0.5.8", features = ["preserve_order"] }
regex = "1.7.1"
genco = "^0.17.8"
clap = "4.4"
convert_case = "^0.6.0"
codespan-reporting = "0.11.1"
colored = "2.0.0"
serde_with = "3.10.0"

sui-move-build = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
sui-move = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9", features = [
    "build",
] }
sui-sdk = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
sui-json-rpc-types = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
move-model = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
move-core-types = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
move-binary-format = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
move-symbol-pool = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
move-bytecode-utils = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
move-compiler = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
move-package = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }
move-command-line-common = { git = "https://github.com/MystenLabs/sui", rev = "c9ae0f9" }